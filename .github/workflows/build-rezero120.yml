name: Build Rezero 1.20.1
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Descompactar e compilar
        run: |
          ZIP=$(ls rezero120*.zip | head -n 1)
          mkdir -p work
          unzip -q "$ZIP" -d work
          cd work/rezero120
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: rezero120-jar
          path: work/rezero120/build/libs/*.jar
